[package]
name = "agenttrackerisland"
version = "0.1.0"
description = "主流 AI Agent 的旁路观测台:状态监控与用量统计"
authors = ["LDT"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agenttracker_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
anyhow = "1.0.104"
# 日志门面(tauri 传递依赖已入树,零新增下载;std feature 供自实现文件后端)
log = { version = "0.4", features = ["std"] }
chrono = "0.4.45"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
sysinfo = "0.39.6"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 不用 abort(2026-09-17 审查):聚合线程的 panic 隔离依赖 unwind(catch_unwind),
# 常驻工具"单线程故障不整体退出"优先于二进制体积
strip = true
